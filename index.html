<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bestellung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Caveat:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;
  --surface:#f7f2e6;
  --paper:#f2e7cf;
  --ink:#2a2018;
  --ink-soft:#6b5a43;
  --muted:#8a7a63;
  --rust:#a34430;
  --rust-dark:#8a3626;
  --olive:#5c6b3f;
  --olive-dark:#455030;
  --gold:#a5761f;
  --line:rgba(42,32,24,.12);

  --cat1:#5c6b3f;
  --cat2:#a5761f;
  --cat3:#a34430;
  --cat4:#c2703a;
  --cat5:#8a4a6b;
  --cat6:#3f5a78;
  --cat7:#3f6b6b;
  --cat8:#5a4a78;
}

*{
  box-sizing:border-box;
}

html{
  margin:0;
  padding:0;
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0 0 calc(92px + env(safe-area-inset-bottom));
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:'Work Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

a{
  color:inherit;
}

::selection{
  background:var(--gold);
  color:#fff;
}


/* =========================================================
   WARENKORB – OBEN RECHTS
   ========================================================= */

.cart-fab{
  position:fixed;
  top:max(10px, env(safe-area-inset-top));
  right:10px;
  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;

  width:46px;
  height:46px;
  padding:0;

  border:1px solid rgba(163,68,48,.25);
  border-radius:50%;

  background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  color:var(--rust);
  cursor:pointer;

  box-shadow:0 3px 12px rgba(42,32,24,.13);
}

.cart-fab span:not(.cart-fab-badge){
  display:none;
}

.cart-fab svg{
  width:20px;
  height:20px;
}

.cart-fab-badge{
  position:absolute;
  top:-4px;
  right:-4px;

  min-width:20px;
  height:20px;
  padding:0 5px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:999px;

  background:var(--rust);
  color:#fff;

  font-size:11px;
  font-weight:700;
}


/* =========================================================
   GAST – NAME + TISCH
   ========================================================= */

.guest-card{
  width:min(100% - 24px,640px);
  margin:12px auto 8px;
  padding:12px;

  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
}

.guest-row{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(105px,.65fr);
  gap:10px;
}

.field{
  min-width:0;
}

.field label{
  display:block;
  margin:0 0 6px 2px;

  color:var(--ink-soft);
  font-size:12.5px;
  font-weight:600;
}

.field input,
.field select{
  width:100%;
  height:46px;
  padding:0 12px;

  border:1px solid rgba(42,32,24,.12);
  border-radius:9px;

  background:#fff;
  color:var(--ink);

  font-size:15px;
}

.field input::placeholder{
  color:#a99a86;
}

.field input:focus,
.field select:focus{
  outline:2px solid var(--gold);
  outline-offset:1px;
}


/* =========================================================
   HAUPTKATEGORIEN
   ========================================================= */

nav.catnav{
  position:sticky;
  top:0;
  z-index:20;

  margin-top:6px;
  padding:8px 10px;

  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border-bottom:1px solid var(--line);
}

.catnav-inner{
  width:min(100%,640px);
  margin:0 auto;

  display:flex;
  flex-wrap:wrap;
  gap:6px;

  justify-content:center;

  padding:1px 2px 3px;
}

.catnav-inner::-webkit-scrollbar{
  display:none;
}

.cat-pill{
  flex:0 0 auto;

  min-height:44px;
  padding:0 17px;

  border:0;
  border-radius:11px;

  color:#fff;

  font-size:14.5px;
  font-weight:700;

  white-space:nowrap;
  cursor:pointer;

  opacity:.4;

  box-shadow:0 2px 5px rgba(42,32,24,.12);

  transition:
    opacity .15s ease,
    transform .15s ease,
    box-shadow .15s ease;
}

.cat-pill.active{
  opacity:1;
  transform:scale(1.08);
  box-shadow:
    0 0 0 3px var(--ink),
    0 4px 10px rgba(42,32,24,.25);
}

.cat-pill:active{
  transform:scale(.97);
}

.catnav-inner .cat-pill:nth-child(8n+1){background:var(--cat1);}
.catnav-inner .cat-pill:nth-child(8n+2){background:var(--cat2);}
.catnav-inner .cat-pill:nth-child(8n+3){background:var(--cat3);}
.catnav-inner .cat-pill:nth-child(8n+4){background:var(--cat4);}
.catnav-inner .cat-pill:nth-child(8n+5){background:var(--cat5);}
.catnav-inner .cat-pill:nth-child(8n+6){background:var(--cat6);}
.catnav-inner .cat-pill:nth-child(8n+7){background:var(--cat7);}
.catnav-inner .cat-pill:nth-child(8n+8){background:var(--cat8);}


/* =========================================================
   MAIN
   ========================================================= */

main{
  width:min(100%,640px);
  margin:0 auto;
  padding:20px 12px 12px;
}

section.cat{
  margin-top:22px;
  scroll-margin-top:70px;
}

section.cat h2{
  margin:0 0 0 2px;

  color:var(--gold);

  font-family:'Work Sans',sans-serif;
  font-size:15px;
  font-weight:700;

  letter-spacing:.7px;
  line-height:1.2;
  text-transform:uppercase;
}

section.cat .cat-hr{
  width:30px;
  height:2px;

  margin:7px 0 13px 2px;

  background:var(--olive);
}


/* =========================================================
   UNTERKATEGORIEN
   ========================================================= */

.subtabs{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
  gap:7px;

  margin:0 0 15px;
  padding:5px;

  background:var(--surface);
  border-radius:10px;
}

.subtabs::-webkit-scrollbar{
  display:none;
}

.subtab-pill{
  width:100%;
  min-height:44px;
  padding:9px 12px;

  border:1px solid var(--line);
  border-radius:10px;

  background:#fff;
  color:var(--ink-soft);

  font-size:14px;
  font-weight:700;
  line-height:1.25;

  white-space:normal;
  cursor:pointer;
}

.subtab-pill.active{
  border-color:var(--olive);
  background:var(--olive);
  color:#fff;

  box-shadow:0 2px 7px rgba(42,32,24,.15);
}


/* =========================================================
   GRUPPEN
   ========================================================= */

.subgroup-heading{
  margin:16px 2px 11px;
  padding-top:12px;

  border-top:1px dashed var(--line);

  color:var(--gold);

  font-size:14.5px;
  font-weight:700;
  letter-spacing:.15px;
}

.subgroup-heading:first-child{
  margin-top:0;
  padding-top:0;
  border-top:0;
}


/* =========================================================
   PRODUKT-GRID
   ========================================================= */

.items-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;

  align-items:stretch;
}

.items-grid .item-wide{
  grid-column:1 / -1;
}


/* =========================================================
   PRODUKTKARTE
   ========================================================= */

.item{
  display:flex;
  flex-direction:column;

  min-width:0;
  min-height:128px;

  padding:12px;

  background:var(--paper);
  color:var(--ink);

  border:1px solid rgba(42,32,24,.07);
  border-radius:12px;
}

.item-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:7px;

  min-width:0;
}

.item-head h3{
  min-width:0;
  margin:0;

  color:var(--ink);

  font-family:'Fraunces',serif;
  font-size:15.5px;
  font-weight:600;
  line-height:1.2;

  overflow-wrap:anywhere;
}

.item-price{
  flex:none;

  color:var(--rust-dark);

  font-family:'Fraunces',serif;
  font-size:15px;
  font-weight:600;

  white-space:nowrap;
}

.item-desc{
  margin:3px 0 0;

  color:#5a4a38;

  font-size:11px;
  line-height:1.35;
}


/* =========================================================
   AUSWAHL / VARIANTEN
   ========================================================= */

.opt-row{
  margin-top:9px;
}

.opt-label{
  margin-bottom:5px;

  color:#6b5a3f;

  font-size:12px;
  font-weight:600;
}

.variant-list,
.flavor-row,
.extras-list{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.variant-btn,
.flavor-btn{
  width:100%;
  min-height:44px;
  padding:9px 12px;

  border:1.5px solid #e2d3ac;
  border-radius:10px;

  background:#fbf5e6;
  color:var(--ink);

  font-family:'Work Sans',sans-serif;
  font-size:13.5px;
  font-weight:600;

  cursor:pointer;

  text-align:left;
}

.flavor-btn{
  text-align:left;
}

.variant-btn{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.variant-btn .vb-label{
  min-width:0;
  line-height:1.25;
}

.variant-btn .vb-price{
  flex:none;
  color:#8a6a2f;
  white-space:nowrap;
}

.variant-btn.active,
.flavor-btn.active{
  background:var(--rust);
  border-color:var(--rust);
  color:#fff;

  box-shadow:0 2px 7px rgba(163,68,48,.22);
}

.variant-btn.active .vb-price{
  color:#fff;
}


/* =========================================================
   EXTRAS
   ========================================================= */

.extra-chip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  min-height:44px;
  padding:9px 12px;

  border:1.5px solid #e2d3ac;
  border-radius:10px;

  background:#fbf5e6;
  color:var(--ink);

  font-size:13.5px;
  font-weight:600;

  cursor:pointer;
}

.extra-chip .ex-label{
  display:flex;
  align-items:center;
  gap:8px;

  min-width:0;
}

.extra-chip input{
  flex:none;

  width:17px;
  height:17px;

  margin:0;

  accent-color:var(--rust);
}

.extra-chip .ex-price{
  flex:none;

  color:#8a6a2f;

  font-size:12px;
  font-weight:700;

  white-space:nowrap;
}

.extra-chip.active{
  background:var(--rust);
  border-color:var(--rust);
  color:#fff;

  box-shadow:0 2px 7px rgba(163,68,48,.22);
}

.extra-chip.active .ex-price{
  color:#fff;
}


/* =========================================================
   MENGE
   ========================================================= */

.qty-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  margin-top:auto;
  padding-top:9px;
}

.qty-ctrl{
  display:flex;
  align-items:center;

  height:34px;

  border:1px solid #d8c9a4;
  border-radius:8px;

  overflow:hidden;
}

.qty-btn{
  width:34px;
  height:34px;

  border:0;

  background:#fbf5e6;
  color:var(--ink);

  font-size:18px;
  line-height:1;

  cursor:pointer;
}

.qty-btn:active{
  background:#efe2bf;
}

.qty-val{
  min-width:26px;

  text-align:center;

  font-size:14px;
  font-weight:600;
}

.line-total{
  min-height:18px;

  color:var(--rust-dark);

  font-family:'Fraunces',serif;
  font-size:14px;
  font-weight:600;

  white-space:nowrap;
}


/* =========================================================
   BOTTOM WARENKORB
   ========================================================= */

.cartbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;

  padding:
    9px
    10px
    calc(9px + env(safe-area-inset-bottom));

  background:rgba(247,242,230,.97);
  border-top:1px solid var(--line);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.cartbar-inner{
  width:min(100%,640px);
  margin:0 auto;

  display:flex;
  align-items:center;
  gap:10px;
}

.cartbar-info{
  flex:1;
  min-width:0;
}

.cartbar-info .cnt{
  color:var(--ink-soft);

  font-size:11.5px;
  line-height:1.2;
}

.cartbar-info .tot{
  margin-top:1px;

  color:var(--gold);

  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:700;
}

.cartbar-btn{
  min-height:46px;
  padding:0 18px;

  border:0;
  border-radius:10px;

  background:var(--rust);
  color:#fff;

  font-size:14.5px;
  font-weight:700;

  cursor:pointer;
  white-space:nowrap;
}

.cartbar-btn:disabled{
  background:#d9cdb9;
  color:#8a7a63;
}


/* =========================================================
   WARENKORB OVERLAY
   ========================================================= */

.overlay{
  position:fixed;
  inset:0;
  z-index:40;

  display:none;
  align-items:flex-end;
  justify-content:center;

  background:rgba(30,24,18,.48);
}

.overlay.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:640px;
  max-height:88vh;

  overflow-y:auto;

  padding:
    18px
    14px
    calc(18px + env(safe-area-inset-bottom));

  background:var(--paper);
  color:var(--ink);

  border-radius:16px 16px 0 0;

  -webkit-overflow-scrolling:touch;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:10px;
}

.sheet h2{
  margin:0;

  font-family:'Fraunces',serif;
  font-size:23px;
}

.sheet-close{
  flex:none;

  width:38px;
  height:38px;

  border:1px solid #d8c9a4;
  border-radius:9px;

  background:#fbf5e6;
  color:var(--ink);

  font-size:17px;
  cursor:pointer;
}

.sheet .meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  margin-bottom:10px;

  color:#6b5a3f;

  font-size:13px;
}

.sheet .meta b{
  color:var(--ink);
}

.meta-clear{
  display:flex;
  align-items:center;
  gap:5px;

  flex:none;

  padding:7px 10px;

  border:1px solid #d8c9a4;
  border-radius:999px;

  background:#fbf5e6;
  color:var(--rust);

  font-size:12px;
  font-weight:600;

  cursor:pointer;
}


/* =========================================================
   WARENKORB POSITIONEN
   ========================================================= */

.sum-line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;

  gap:8px;

  padding:10px 0;

  border-bottom:1px dashed #d8c9a4;
}

.sum-line .nm{
  min-width:0;
}

.sum-line .nm .ttl{
  display:block;

  font-size:14px;
  font-weight:600;
  line-height:1.25;
}

.sum-line .nm .opt{
  display:block;

  margin-top:2px;

  color:#8a7a63;

  font-size:11px;
  line-height:1.35;
}

.sum-line-right{
  display:flex;
  align-items:center;
  gap:6px;
}

.sum-qty-ctrl{
  display:flex;
  align-items:center;

  height:32px;

  border:1px solid #d8c9a4;
  border-radius:8px;

  overflow:hidden;

  background:#fbf5e6;
}

.sum-qty-ctrl button{
  width:30px;
  height:32px;

  border:0;
  background:transparent;

  color:var(--ink);

  font-size:16px;

  cursor:pointer;
}

.sum-qty-ctrl span{
  min-width:23px;

  text-align:center;

  font-size:13px;
  font-weight:600;
}

.sum-line-total{
  min-width:55px;

  color:var(--rust-dark);

  font-family:'Fraunces',serif;
  font-size:14px;
  font-weight:600;

  text-align:right;
}

.sum-remove{
  width:31px;
  height:31px;

  border:1px solid #d8c9a4;
  border-radius:8px;

  background:#fbf5e6;
  color:var(--rust);

  font-size:14px;

  cursor:pointer;
}


/* =========================================================
   SCHNELL HINZUFÜGEN
   ========================================================= */

.quickadd{
  margin-top:12px;
  padding-top:12px;

  border-top:1px solid #d8c9a4;
}

.quickadd input{
  width:100%;
  height:44px;

  padding:0 12px;

  border:1px solid #d8c9a4;
  border-radius:9px;

  background:#fbf5e6;
  color:var(--ink);

  font-size:14px;
}

.quickadd input:focus{
  outline:2px solid var(--olive);
  outline-offset:1px;
}

.quickadd-results{
  display:flex;
  flex-direction:column;
  gap:6px;

  max-height:200px;

  margin-top:7px;

  overflow-y:auto;
}

.quickadd-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  padding:8px 9px;

  border:1px solid #e2d3ac;
  border-radius:8px;

  background:#fbf5e6;
}

.quickadd-row .qa-name{
  font-size:13px;
  font-weight:600;
}

.quickadd-row .qa-price{
  margin-left:4px;

  color:#8a6a2f;

  font-size:11px;
  font-weight:600;
}

.quickadd-row button{
  flex:none;

  width:34px;
  height:34px;

  border:0;
  border-radius:8px;

  background:var(--olive);
  color:#fff;

  font-size:18px;

  cursor:pointer;
}

.quickadd-empty{
  padding:4px 2px;

  color:#8a7a63;

  font-size:12px;
}


/* =========================================================
   GESAMT
   ========================================================= */

.sum-total{
  display:flex;
  align-items:baseline;
  justify-content:space-between;

  margin-top:12px;
  padding-top:10px;

  border-top:2px solid var(--ink);
}

.sum-total .lbl{
  font-size:15px;
  font-weight:600;
}

.sum-total .val{
  color:var(--rust-dark);

  font-family:'Fraunces',serif;
  font-size:25px;
  font-weight:700;
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:13px;
}

.btn-secondary,
.btn-primary{
  min-height:46px;
  padding:0 12px;

  border-radius:10px;

  font-size:14px;
  font-weight:700;

  cursor:pointer;
}

.btn-secondary{
  border:1px solid #b6a679;
  background:transparent;
  color:var(--ink);
}

.btn-primary{
  border:0;
  background:var(--olive);
  color:#fff;
}


/* =========================================================
   FOOTER
   ========================================================= */


/* =========================================================
   KLEINE HANDYS
   ========================================================= */

@media(max-width:380px){

  .guest-card{
    width:calc(100% - 18px);
    padding:10px;
  }

  .guest-row{
    grid-template-columns:minmax(0,1.25fr) minmax(95px,.75fr);
    gap:7px;
  }

  .field input,
  .field select{
    height:43px;
    padding:0 10px;
    font-size:14px;
  }

  main{
    padding-left:9px;
    padding-right:9px;
  }

  .items-grid{
    gap:7px;
  }

  .item{
    padding:10px;
    min-height:126px;
  }

  .item-head h3{
    font-size:15px;
  }

  .item-price{
    font-size:14px;
  }

  .cartbar-btn{
    padding:0 13px;
    font-size:13px;
  }

  .cartbar-info .tot{
    font-size:20px;
  }
}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

@media(min-width:600px){

  .cart-fab{
    width:auto;
    height:auto;

    padding:11px 14px;

    border-radius:999px;
  }

  .cart-fab span:not(.cart-fab-badge){
    display:block;
    font-size:13px;
  }

  .cart-fab-badge{
    position:static;
    min-width:22px;
    height:22px;
  }

  .guest-card{
    margin-top:18px;
  }

  nav.catnav{
    padding:10px 14px;
  }

  .catnav-inner{
    justify-content:center;
    flex-wrap:wrap;
    overflow:visible;
  }

/* ============ STATE ============ */
const state = {};
function defaultConfig(item){
  return {
    extras:{},
    variant: item.variants ? item.variants[0].key : null,
    flavor: item.flavorOptions ? item.flavorOptions[0] : null,
  };
}
function getState(item){
  if(!state[item.id]){
    state[item.id] = {
      current: defaultConfig(item),
      lines: {}, // configKey -> {qty, extras, variant, flavor}
    };
  }
  return state[item.id];
}
function configKey(item, cfg){
  const parts = [];
  if(item.variants) parts.push('v:'+cfg.variant);
  if(item.flavorOptions) parts.push('f:'+cfg.flavor);
  if(item.extras) parts.push('e:'+item.extras.filter(ex=>cfg.extras[ex.key]).map(ex=>ex.key).sort().join(','));
  return parts.join('|') || 'default';
}
function fmt(n){ return n.toFixed(2).replace('.', ',') + ' €'; }
function unitPriceForConfig(item, cfg){
  let base = item.variants ? item.variants.find(v=>v.key===cfg.variant).price : item.price;
  let extrasSum = 0;
  if(item.extras) item.extras.forEach(e=>{ if(cfg.extras[e.key]) extrasSum += e.price; });
  return base + extrasSum;
}
function currentLine(item){
  const st = getState(item);
  const key = configKey(item, st.current);
  return st.lines[key] || null;
}
function displayedQty(item){
  const l = currentLine(item);
  return l ? l.qty : 0;
}

/* traverse every item in the whole menu, regardless of nesting */
function forEachItem(cb){
  MENU.forEach(entry=>{
    if(entry.kind==='list'){
      entry.items.forEach(cb);
    } else if(entry.kind==='tabs'){
      entry.tabs.forEach(tab=>{
        if(tab.items) tab.items.forEach(cb);
        if(tab.groups) tab.groups.forEach(g=>g.items.forEach(cb));
      });
    }
  });
}

const allItemsById = {};
forEachItem(item=>{ allItemsById[item.id] = item; getState(item); });

const SEARCH_INDEX = {};
function buildSearchIndex(){
  MENU.forEach(entry=>{
    if(entry.kind==='list'){
      entry.items.forEach(item=>{
        SEARCH_INDEX[item.id] = normalize([item.name, entry.label, item.desc||''].join(' '));
      });
    } else if(entry.kind==='tabs'){
      entry.tabs.forEach(tab=>{
        if(tab.items){
          tab.items.forEach(item=>{
            SEARCH_INDEX[item.id] = normalize([item.name, entry.label, tab.label, item.desc||''].join(' '));
          });
        }
        if(tab.groups){
          tab.groups.forEach(g=>{
            g.items.forEach(item=>{
              SEARCH_INDEX[item.id] = normalize([item.name, entry.label, tab.label, g.label, item.desc||''].join(' '));
            });
          });
        }
      });
    }
  });
}
buildSearchIndex();

/* ============ RENDER ITEM CARD ============ */
function renderItemCard(item){
  const st = getState(item);
  const card = document.createElement('div');
  card.className = 'item';
  card.id = 'item-'+item.id;

  const head = document.createElement('div');
  head.className = 'item-head';
  const h3 = document.createElement('h3');
  h3.textContent = item.name;
  head.appendChild(h3);
  const priceEl = document.createElement('div');
  priceEl.className = 'item-price';
  priceEl.id = 'price-'+item.id;
  head.appendChild(priceEl);
  card.appendChild(head);

  if(item.desc){
    const d = document.createElement('p');
    d.className = 'item-desc';
    d.textContent = item.desc;
    card.appendChild(d);
  }

  if(item.variants){
    const row = document.createElement('div');
    row.className = 'opt-row variant-list';
    item.variants.forEach(v=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'variant-btn' + (v.key===st.current.variant ? ' active' : '');
      btn.innerHTML = `<span class="vb-label">${v.label}</span><span class="vb-price">${fmt(v.price)}</span>`;
      btn.addEventListener('click', ()=>{
        st.current.variant = v.key;
        row.querySelectorAll('.variant-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        refreshItem(item);
        refreshCart();
      });
      row.appendChild(btn);
    });
    card.appendChild(row);
  }

  if(item.flavorOptions){
    const row = document.createElement('div');
    row.className = 'opt-row';
    const lbl = document.createElement('div');
    lbl.className = 'opt-label';
    lbl.textContent = item.flavorLabel || 'Auswahl';
    row.appendChild(lbl);
    const btnRow = document.createElement('div');
    btnRow.className = 'flavor-row';
    item.flavorOptions.forEach(f=>{
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'flavor-btn' + (f===st.current.flavor ? ' active' : '');
      btn.textContent = f;
      btn.addEventListener('click', ()=>{
        st.current.flavor = f;
        btnRow.querySelectorAll('.flavor-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        refreshItem(item);
        refreshCart();
      });
      btnRow.appendChild(btn);
    });
    row.appendChild(btnRow);
    card.appendChild(row);
  }

  if(item.extras){
    const row = document.createElement('div');
    row.className = 'opt-row';
    const lbl = document.createElement('div');
    lbl.className = 'opt-label';
    lbl.textContent = 'Extras';
    row.appendChild(lbl);
    const list = document.createElement('div');
    list.className = 'extras-list';
    item.extras.forEach(ex=>{
      const chip = document.createElement('label');
      chip.className = 'extra-chip';
      chip.innerHTML = `<span class="ex-label"><input type="checkbox" data-key="${ex.key}"> ${ex.label}</span><span class="ex-price">+ ${fmt(ex.price)}</span>`;
      const cb = chip.querySelector('input');
      cb.addEventListener('change', (e)=>{
        st.current.extras[ex.key] = e.target.checked;
        chip.classList.toggle('active', e.target.checked);
        refreshItem(item); refreshCart();
      });
      list.appendChild(chip);
    });
    row.appendChild(list);
    card.appendChild(row);
  }

  const qtyRow = document.createElement('div');
  qtyRow.className = 'qty-row';
  const ctrl = document.createElement('div');
  ctrl.className = 'qty-ctrl';
  const minus = document.createElement('button');
  minus.className = 'qty-btn'; minus.textContent = '–'; minus.type='button';
  const val = document.createElement('span');
  val.className = 'qty-val'; val.id = 'qty-'+item.id; val.textContent = '0';
  const plus = document.createElement('button');
  plus.className = 'qty-btn'; plus.textContent = '+'; plus.type='button';
  minus.addEventListener('click', ()=>{
    const l = currentLine(item);
    if(l){
      l.qty = Math.max(0, l.qty-1);
      if(l.qty===0){
        const key = configKey(item, st.current);
        delete st.lines[key];
      }
    }
    refreshItem(item); refreshCart();
  });
  plus.addEventListener('click', ()=>{
    const key = configKey(item, st.current);
    if(!st.lines[key]){
      st.lines[key] = {
        qty:0,
        extras:{...st.current.extras},
        variant:st.current.variant,
        flavor:st.current.flavor,
      };
    }
    st.lines[key].qty += 1;
    refreshItem(item); refreshCart();
  });
  ctrl.appendChild(minus); ctrl.appendChild(val); ctrl.appendChild(plus);
  qtyRow.appendChild(ctrl);
  const lineTotal = document.createElement('div');
  lineTotal.className = 'line-total';
  lineTotal.id = 'linetotal-'+item.id;
  qtyRow.appendChild(lineTotal);
  card.appendChild(qtyRow);

  if(item.flavorOptions || item.variants){
    card.classList.add('item-wide');
  }

  return card;
}

function refreshItem(item){
  const st = getState(item);
  const up = unitPriceForConfig(item, st.current);
  const qty = displayedQty(item);
  document.getElementById('price-'+item.id).textContent = fmt(up);
  document.getElementById('qty-'+item.id).textContent = qty;
  document.getElementById('linetotal-'+item.id).textContent = qty>0 ? fmt(up*qty) : '';
}

/* ============ RENDER SECTIONS ============ */
const menuRoot = document.getElementById('menuRoot');
const catnavInner = document.getElementById('catnavInner');
const catPills = [];
const catSections = [];

let currentCatIdx = 0;
function showCategory(idx){
  currentCatIdx = idx;
  catSections.forEach((s,i)=> s.style.display = (i===idx ? '' : 'none'));
  catPills.forEach((p,i)=> p.classList.toggle('active', i===idx));
  window.scrollTo(0, 0);
}

MENU.forEach((entry, catIdx)=>{
  const pill = document.createElement('button');
  pill.className = 'cat-pill' + (catIdx===0 ? ' active' : '');
  pill.textContent = entry.label;
  pill.type = 'button';
  pill.addEventListener('click', ()=> showCategory(catIdx));
  catnavInner.appendChild(pill);
  catPills.push(pill);

  const section = document.createElement('section');
  section.className = 'cat';
  section.id = 'cat-'+entry.id;
  if(catIdx!==0) section.style.display = 'none';

  const h2 = document.createElement('h2');
  h2.textContent = entry.label;
  section.appendChild(h2);
  const hr = document.createElement('div');
  hr.className = 'cat-hr';
  section.appendChild(hr);

  if(entry.kind === 'list'){
    const grid = document.createElement('div');
    grid.className = 'items-grid';
    entry.items.forEach(item=> grid.appendChild(renderItemCard(item)));
    section.appendChild(grid);
  } else if(entry.kind === 'tabs'){
    const tabRow = document.createElement('div');
    tabRow.className = 'subtabs';
    const panels = [];
    entry.tabs.forEach((tab, idx)=>{
      const btn = document.createElement('button');
      btn.className = 'subtab-pill' + (idx===0 ? ' active' : '');
      btn.textContent = tab.label;
      btn.type = 'button';
      tabRow.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'subpanel';
      if(idx!==0) panel.style.display = 'none';

      if(tab.items){
        const grid = document.createElement('div');
        grid.className = 'items-grid';
        tab.items.forEach(item=> grid.appendChild(renderItemCard(item)));
        panel.appendChild(grid);
      } else if(tab.groups){
        tab.groups.forEach(g=>{
          const gh = document.createElement('div');
          gh.className = 'subgroup-heading';
          gh.textContent = g.label;
          panel.appendChild(gh);
          const grid = document.createElement('div');
          grid.className = 'items-grid';
          g.items.forEach(item=> grid.appendChild(renderItemCard(item)));
          panel.appendChild(grid);
        });
      }
      panels.push(panel);

      btn.addEventListener('click', ()=>{
        tabRow.querySelectorAll('.subtab-pill').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        panels.forEach(p=>p.style.display='none');
        panel.style.display='';
        window.scrollTo(0, 0);
      });
    });
    section.appendChild(tabRow);
    panels.forEach(p=>section.appendChild(p));
  }

  menuRoot.appendChild(section);
  catSections.push(section);
});

forEachItem(item=>refreshItem(item));

/* ============ CART / SUMMARY ============ */
const tableSel = document.getElementById('tableSel');
const placeholderOpt = document.createElement('option');
placeholderOpt.value = '';
placeholderOpt.textContent = '– Tisch wählen –';
placeholderOpt.disabled = false;
tableSel.appendChild(placeholderOpt);
tableSel.value = '';
for(let i=1;i<=23;i++){
  const o = document.createElement('option');
  o.value = i; o.textContent = 'Tisch ' + i;
  tableSel.appendChild(o);
}

function getCartLines(){
  const lines = [];
  forEachItem(item=>{
    const st = getState(item);
    Object.keys(st.lines).forEach(key=>{
      const line = st.lines[key];
      if(line.qty <= 0) return;
      const up = unitPriceForConfig(item, line);
      const opts = [];
      if(item.variants) opts.push(item.variants.find(v=>v.key===line.variant).label);
      if(item.flavorOptions) opts.push(line.flavor);
      if(item.extras) item.extras.forEach(ex=>{ if(line.extras[ex.key]) opts.push('+ '+ex.label); });
      lines.push({ id:item.id, key, name:item.name, qty:line.qty, unit:up, total:up*line.qty, opts });
    });
  });
  return lines;
}

function refreshCart(){
  const lines = getCartLines();
  const count = lines.reduce((s,l)=>s+l.qty,0);
  const total = lines.reduce((s,l)=>s+l.total,0);
  document.getElementById('cartCount').textContent = count===0 ? 'Noch keine Auswahl' : (count + (count===1?' Position':' Positionen'));
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('showSummaryBtn').disabled = count===0;
  document.getElementById('cartFabBadge').textContent = count;
  if(overlay.classList.contains('show')) renderSummary();
}
const overlay = document.getElementById('overlay');
refreshCart();

function renderSummary(){
  const lines = getCartLines();
  const total = lines.reduce((s,l)=>s+l.total,0);
  document.getElementById('sumName').textContent = document.getElementById('guestName').value.trim() || '(ohne Namen)';
  document.getElementById('sumTable').textContent = tableSel.value || '–';
  const sumLines = document.getElementById('sumLines');
  const emptyNote = document.getElementById('sumEmpty');
  sumLines.innerHTML = '';
  emptyNote.style.display = lines.length===0 ? '' : 'none';

  lines.forEach(l=>{
    const item = allItemsById[l.id];
    const st = getState(item);
    const line = st.lines[l.key];
    const row = document.createElement('div');
    row.className = 'sum-line';

    const nm = document.createElement('div');
    nm.className = 'nm';
    const optHtml = l.opts.length ? `<span class="opt">${l.opts.join(' · ')}</span>` : '';
    nm.innerHTML = `<span class="ttl">${l.name}</span>${optHtml}`;
    row.appendChild(nm);

    const right = document.createElement('div');
    right.className = 'sum-line-right';

    const ctrl = document.createElement('div');
    ctrl.className = 'sum-qty-ctrl';
    const minus = document.createElement('button');
    minus.type = 'button'; minus.textContent = '–';
    const qtySpan = document.createElement('span');
    qtySpan.textContent = line.qty;
    const plus = document.createElement('button');
    plus.type = 'button'; plus.textContent = '+';
    minus.addEventListener('click', ()=>{
      line.qty = Math.max(0, line.qty-1);
      if(line.qty===0) delete st.lines[l.key];
      refreshItem(item); refreshCart();
    });
    plus.addEventListener('click', ()=>{ line.qty += 1; refreshItem(item); refreshCart(); });
    ctrl.appendChild(minus); ctrl.appendChild(qtySpan); ctrl.appendChild(plus);
    right.appendChild(ctrl);

    const lt = document.createElement('div');
    lt.className = 'sum-line-total';
    lt.textContent = fmt(l.total);
    right.appendChild(lt);

    const rm = document.createElement('button');
    rm.className = 'sum-remove';
    rm.type = 'button';
    rm.setAttribute('aria-label', 'Entfernen');
    rm.textContent = '✕';
    rm.addEventListener('click', ()=>{
      delete st.lines[l.key];
      refreshItem(item); refreshCart();
    });
    right.appendChild(rm);

    row.appendChild(right);
    sumLines.appendChild(row);
  });

  document.getElementById('sumTotalVal').textContent = fmt(total);
}

/* ---- quick add search (inside the cart) ---- */
const quickAddInput = document.getElementById('quickAddInput');
const quickAddResults = document.getElementById('quickAddResults');

function normalize(s){
  return s.toString().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'') // ä→a, é→e, ü→u, …
    .replace(/ß/g,'ss')
    .replace(/cola/g,'kola'); // treat "cola"/"kola" as the same word
}

function renderQuickAddResults(){
  const qNorm = normalize(quickAddInput.value.trim());
  quickAddResults.innerHTML = '';
  if(qNorm.length < 2){ return; }
  const words = qNorm.split(/\s+/).filter(Boolean);

  const nameMatches = [];
  const otherMatches = [];
  forEachItem(item=>{
    const nameNorm = normalize(item.name);
    if(words.every(w=>nameNorm.includes(w))){
      nameMatches.push(item);
      return;
    }
    const idx = SEARCH_INDEX[item.id] || nameNorm;
    if(words.every(w=>idx.includes(w))) otherMatches.push(item);
  });
  const matches = nameMatches.concat(otherMatches);

  if(matches.length === 0){
    const p = document.createElement('div');
    p.className = 'quickadd-empty';
    p.textContent = 'Nichts gefunden.';
    quickAddResults.appendChild(p);
    return;
  }

  matches.slice(0, 8).forEach(item=>{
    const st = getState(item);
    const defCfg = defaultConfig(item);
    const up = unitPriceForConfig(item, defCfg);
    const row = document.createElement('div');
    row.className = 'quickadd-row';
    row.innerHTML = `<span><span class="qa-name">${item.name}</span><span class="qa-price">${fmt(up)}</span></span>`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '+';
    btn.setAttribute('aria-label', item.name + ' hinzufügen');
    btn.addEventListener('click', ()=>{
      const key = configKey(item, defCfg);
      if(!st.lines[key]){
        st.lines[key] = { qty:0, extras:{...defCfg.extras}, variant:defCfg.variant, flavor:defCfg.flavor };
      }
      st.lines[key].qty += 1;
      refreshItem(item);
      refreshCart();
      quickAddInput.value = '';
      quickAddResults.innerHTML = '';
    });
    row.appendChild(btn);
    quickAddResults.appendChild(row);
  });
}
quickAddInput.addEventListener('input', renderQuickAddResults);

function openCart(){ renderSummary(); quickAddInput.value=''; quickAddResults.innerHTML=''; overlay.classList.add('show'); }
function closeCart(){ overlay.classList.remove('show'); }

function clearCartItems(){
  forEachItem(item=>{
    const st = getState(item);
    st.lines = {};
    st.current = defaultConfig(item);

    const card = document.getElementById('item-'+item.id);
    if(card){
      card.querySelectorAll('.extra-chip').forEach(chip=>{
        chip.classList.remove('active');
        const cb = chip.querySelector('input[type=checkbox]');
        if(cb) cb.checked = false;
      });
      card.querySelectorAll('.variant-btn').forEach((b,i)=>b.classList.toggle('active', i===0));
      card.querySelectorAll('.flavor-btn').forEach((b,i)=>b.classList.toggle('active', i===0));
    }
    refreshItem(item);
  });
  refreshCart();
}

document.getElementById('showSummaryBtn').addEventListener('click', openCart);
document.getElementById('cartFabBtn').addEventListener('click', openCart);
document.getElementById('closeSummaryBtn').addEventListener('click', closeCart);
document.getElementById('sheetCloseX').addEventListener('click', closeCart);

/* click on the dark backdrop (outside the sheet) closes the cart */
overlay.addEventListener('click', (e)=>{
  if(e.target === overlay) closeCart();
});

/* small X next to name/table: clears the cart items only, keeps the same guest & table */
document.getElementById('metaClearBtn').addEventListener('click', ()=>{
  clearCartItems();
  renderSummary();
});

/* "Neue Bestellung": clears cart AND name AND table, ready for the next guest */
document.getElementById('newOrderBtn').addEventListener('click', ()=>{
  clearCartItems();
  document.getElementById('guestName').value = '';
  tableSel.selectedIndex = 0;
  closeCart();
});

/* ---- swipe between categories (left = next, right = previous) ---- */
(function(){
  let startX = 0, startY = 0, tracking = false;
  const SWIPE_MIN_DIST = 60;      // minimum horizontal distance in px
  const SWIPE_MAX_OFFAXIS = 60;   // max vertical drift allowed to still count as a swipe

  menuRoot.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});

  menuRoot.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const touch = e.changedTouches[0];
    const dx = touch.clientX - startX;
    const dy = touch.clientY - startY;
    if(Math.abs(dx) < SWIPE_MIN_DIST || Math.abs(dy) > SWIPE_MAX_OFFAXIS) return;

    if(dx < 0 && currentCatIdx < MENU.length-1){
      showCategory(currentCatIdx+1);   // swipe left -> next category
    } else if(dx > 0 && currentCatIdx > 0){
      showCategory(currentCatIdx-1);   // swipe right -> previous category
    }
  }, {passive:true});
})();
</script>
